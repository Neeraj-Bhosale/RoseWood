spring.application.name=rosewood-backend

# =============================================
# DATABASE CONFIG
# For local development, use your local MySQL.
# For production, override via environment variables:
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
# =============================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/restaurant_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Pune411019}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Server port
server.port=${PORT:8080}

# JWT Secret (override in production via env var JWT_SECRET)
app.jwt.secret=${JWT_SECRET:RoseWoodSecretKey2024SuperLongSecureKeyForJWTSigning!}
app.jwt.expiration-ms=86400000

# CORS allowed origin (set to your Vercel frontend URL in production)
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:5173}

# Restaurant config
restaurant.name=RoseWood Fine Dining
restaurant.currency=\u20B9
restaurant.tax-rate=5.0
restaurant.service-charge-rate=2.5
